<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,
initial-scale=1.0,
maximum-scale=1.0,
user-scalable=no">

<title>Cosmic System 🌌</title>

<style>

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
    touch-action: none;
}

canvas {
    display: block;
}

#help {
    position: fixed;
    top: 18px;
    left: 50%;

    transform:
    translateX(-50%);

    color:
    rgba(255,255,255,0.75);

    font-family:
    Arial, sans-serif;

    font-size: 14px;

    padding:
    9px 16px;

    border-radius:
    20px;

    background:
    rgba(5,8,20,0.45);

    backdrop-filter:
    blur(10px);

    pointer-events:
    none;

    white-space:
    nowrap;

    z-index: 5;
}

#planetInfo {

    position: fixed;

    right: 20px;

    top: 50%;

    transform:
    translateY(-50%)
    translateX(30px);

    width: 280px;

    padding: 20px;

    border-radius: 18px;

    color: white;

    background:
    rgba(5,10,25,0.76);

    backdrop-filter:
    blur(16px);

    border:
    1px solid
    rgba(120,170,255,0.25);

    box-shadow:
    0 0 40px
    rgba(50,130,255,0.18);

    font-family:
    Arial, sans-serif;

    opacity: 0;

    transition:
    0.35s ease;

    pointer-events:
    none;

    z-index: 10;
}

#planetInfo.show {

    opacity: 1;

    transform:
    translateY(-50%)
    translateX(0);
}

#planetName {

    margin:
    0 0 10px;

    font-size:
    24px;

    text-shadow:
    0 0 15px
    rgba(120,180,255,0.7);
}

#planetDescription {

    margin: 0;

    line-height:
    1.55;

    font-size:
    14px;

    color:
    rgba(255,255,255,0.75);
}

</style>
</head>

<body>

<div id="help">

🖱️ Двигай мышью • Колесо — масштаб • Нажми планету

</div>

<div id="planetInfo">

<h2 id="planetName"></h2>

<p id="planetDescription"></p>

</div>


<script type="importmap">

{
    "imports": {

        "three":
        "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",

        "three/addons/":
        "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"

    }
}

</script>


<script type="module">

import * as THREE
from "three";

import {
    OrbitControls
}
from "three/addons/controls/OrbitControls.js";


/* =====================================================
   СЦЕНА
===================================================== */

const scene =
new THREE.Scene();

scene.background =
new THREE.Color(
    0x010208
);


/* =====================================================
   КАМЕРА
===================================================== */

const camera =
new THREE.PerspectiveCamera(

    55,

    window.innerWidth /
    window.innerHeight,

    0.1,

    20000

);

camera.position.set(
    0,
    180,
    350
);


/* =====================================================
   RENDERER
===================================================== */

const renderer =
new THREE.WebGLRenderer({

    antialias:
    true,

    powerPreference:
    "high-performance"

});

renderer.setPixelRatio(

    Math.min(
        window.devicePixelRatio,
        2
    )

);

renderer.setSize(

    window.innerWidth,
    window.innerHeight

);

renderer.outputColorSpace =
THREE.SRGBColorSpace;

document.body.appendChild(
    renderer.domElement
);


/* =====================================================
   УПРАВЛЕНИЕ КАМЕРОЙ
===================================================== */

const controls =
new OrbitControls(

    camera,

    renderer.domElement

);

controls.enableDamping =
true;

controls.dampingFactor =
0.035;


/*
   Было 6–1200

   Теперь можно:
   очень близко приблизиться
   и очень далеко отдалиться
*/

controls.minDistance =
3;

controls.maxDistance =
10000;


controls.enablePan =
true;


/* =====================================================
   ОСВЕЩЕНИЕ
===================================================== */

scene.add(

new THREE.AmbientLight(

    0x7185a8,

    0.055

)

);


/* =====================================================
   СОЛНЦЕ
===================================================== */

const sun =
new THREE.Mesh(

    new THREE.SphereGeometry(

        12,

        64,

        64

    ),

    new THREE.MeshBasicMaterial({

        color:
        0xffb52e

    })

);

scene.add(sun);


const sunlight =
new THREE.PointLight(

    0xffc46b,

    5000,

    2000

);

scene.add(
    sunlight
);


/* =====================================================
   СВЕЧЕНИЕ СОЛНЦА
===================================================== */

const sunGlow =
new THREE.Mesh(

    new THREE.SphereGeometry(

        16,

        32,

        32

    ),

    new THREE.MeshBasicMaterial({

        color:
        0xff8c20,

        transparent:
        true,

        opacity:
        0.2,

        side:
        THREE.BackSide

    })

);

sun.add(
    sunGlow
);


/* =====================================================
   ПЛАНЕТЫ
===================================================== */

const planetData = [

{

name:
"Меркурий",

radius:
1.2,

distance:
20,

color:
0xaaa39b,

speed:
0.0020,

rotation:
0.0010,

description:
"Самая маленькая планета Солнечной системы и ближайшая к Солнцу."

},

{

name:
"Венера",

radius:
2.1,

distance:
30,

color:
0xd8a15a,

speed:
0.00145,

rotation:
0.0007,

description:
"Вторая планета от Солнца. Её плотная атмосфера создаёт экстремально высокую температуру."

},

{

name:
"Земля",

radius:
2.5,

distance:
42,

color:
0x287bd1,

speed:
0.0010,

rotation:
0.003,

description:
"Наш дом. Планета с океанами, атмосферой и известной нам жизнью."

},

{

name:
"Марс",

radius:
1.8,

distance:
54,

color:
0xc95b3c,

speed:
0.0008,

rotation:
0.0025,

description:
"Красная планета с огромными вулканами, каньонами и полярными шапками."

},

{

name:
"Юпитер",

radius:
6,

distance:
75,

color:
0xc69b70,

speed:
0.0004,

rotation:
0.005,

description:
"Крупнейшая планета Солнечной системы. Газовый гигант с мощными атмосферными штормами."

},

{

name:
"Сатурн",

radius:
5,

distance:
100,

color:
0xd4bc82,

speed:
0.00028,

rotation:
0.0045,

description:
"Газовый гигант, знаменитый своей впечатляющей системой колец."

},

{

name:
"Уран",

radius:
3.5,

distance:
125,

color:
0x6dc8d5,

speed:
0.00018,

rotation:
0.0035,

description:
"Ледяной гигант голубовато-зелёного цвета с сильно наклонённой осью."

},

{

name:
"Нептун",

radius:
3.4,

distance:
150,

color:
0x416bd8,

speed:
0.00014,

rotation:
0.003,

description:
"Дальний ледяной гигант с очень холодной атмосферой и мощными ветрами."

},

{

name:
"Плутон",

radius:
0.8,

distance:
185,

color:
0xb9a58e,

speed:
0.00007,

rotation:
0.0015,

description:
"Карликовая планета в далёкой области Солнечной системы."

}

];


const planets = [];


/* =====================================================
   СОЗДАНИЕ ПЛАНЕТ
===================================================== */

function createPlanet(data) {

const geometry =
new THREE.SphereGeometry(

    data.radius,

    48,

    48

);


const material =
new THREE.MeshStandardMaterial({

    color:
    data.color,

    roughness:
    0.72,

    metalness:
    0.02

});


const mesh =
new THREE.Mesh(

    geometry,

    material

);


mesh.userData.planet =
data;


scene.add(mesh);


/* Орбита */

const orbit =
new THREE.Mesh(

    new THREE.RingGeometry(

        data.distance - 0.035,

        data.distance + 0.035,

        160

    ),

    new THREE.MeshBasicMaterial({

        color:
        0x536684,

        transparent:
        true,

        opacity:
        0.22,

        side:
        THREE.DoubleSide

    })

);


orbit.rotation.x =
Math.PI / 2;


scene.add(orbit);


const planet = {

    data:
    data,

    mesh:
    mesh,

    angle:
    Math.random()
    *
    Math.PI
    *
    2

};


planets.push(
    planet
);

}


for (
const data
of planetData
) {

createPlanet(
    data
);

}


/* =====================================================
   САТУРН — КОЛЬЦА
===================================================== */

const saturn =
planets.find(

p =>
p.data.name ===
"Сатурн"

);


const saturnRings =
new THREE.Mesh(

new THREE.RingGeometry(

    7,

    11,

    128

),

new THREE.MeshBasicMaterial({

    color:
    0xc9b77d,

    transparent:
    true,

    opacity:
    0.72,

    side:
    THREE.DoubleSide

})

);


saturnRings.rotation.x =
Math.PI / 2;

saturn.mesh.add(
    saturnRings
);


/* =====================================================
   ЗЕМЛЯ — АТМОСФЕРА
===================================================== */

const earth =
planets.find(

p =>
p.data.name ===
"Земля"

);


const atmosphere =
new THREE.Mesh(

new THREE.SphereGeometry(

    2.7,

    32,

    32

),

new THREE.MeshBasicMaterial({

    color:
    0x42aaff,

    transparent:
    true,

    opacity:
    0.16,

    side:
    THREE.BackSide

})

);


earth.mesh.add(
    atmosphere
);


/* =====================================================
   ЛУНА
===================================================== */

const moon =
new THREE.Mesh(

new THREE.SphereGeometry(

    0.7,

    32,

    32

),

new THREE.MeshStandardMaterial({

    color:
    0xb4b4b4,

    roughness:
    0.9

})

);


scene.add(
    moon
);


/* =====================================================
   АСТЕРОИДНЫЙ ПОЯС
===================================================== */

const asteroidCount =
1000;

const asteroidPositions =
new Float32Array(

    asteroidCount *
    3

);


for (
let i = 0;
i < asteroidCount;
i++
) {

const angle =
Math.random()
*
Math.PI
*
2;


const distance =
61 +
Math.random()
*
8;


const height =
(
    Math.random()
    -
    0.5
)
*
3.5;


asteroidPositions[
    i * 3
] =
Math.cos(angle)
*
distance;


asteroidPositions[
    i * 3 + 1
] =
height;


asteroidPositions[
    i * 3 + 2
] =
Math.sin(angle)
*
distance;

}


const asteroidGeometry =
new THREE.BufferGeometry();


asteroidGeometry.setAttribute(

    "position",

    new THREE.BufferAttribute(

        asteroidPositions,

        3

    )

);


const asteroidMaterial =
new THREE.PointsMaterial({

    color:
    0xa7a19a,

    size:
    0.35

});


const asteroidBelt =
new THREE.Points(

    asteroidGeometry,

    asteroidMaterial

);


scene.add(
    asteroidBelt
);


/* =====================================================
   ЗВЁЗДЫ
===================================================== */

const starCount =
15000;


const starPositions =
new Float32Array(

    starCount *
    3

);


for (
let i = 0;
i < starCount;
i++
) {

const radius =
1000 +
Math.random()
*
6000;


const theta =
Math.random()
*
Math.PI
*
2;


const phi =
Math.acos(

    2 *
    Math.random()
    -
    1

);


starPositions[
    i * 3
] =

radius *
Math.sin(phi) *
Math.cos(theta);


starPositions[
    i * 3 + 1
] =

radius *
Math.cos(phi);


starPositions[
    i * 3 + 2
] =

radius *
Math.sin(phi) *
Math.sin(theta);

}


const starGeometry =
new THREE.BufferGeometry();


starGeometry.setAttribute(

    "position",

    new THREE.BufferAttribute(

        starPositions,

        3

    )

);


const starMaterial =
new THREE.PointsMaterial({

    color:
    0xffffff,

    size:
    1.4,

    sizeAttenuation:
    true

});


const stars =
new THREE.Points(

    starGeometry,

    starMaterial

);


scene.add(
    stars
);


/* =====================================================
   ИНФОРМАЦИЯ
===================================================== */

const info =
document.getElementById(
    "planetInfo"
);

const planetName =
document.getElementById(
    "planetName"
);

const planetDescription =
document.getElementById(
    "planetDescription"
);


/* =====================================================
   КЛИК ПО ПЛАНЕТЕ
===================================================== */

const raycaster =
new THREE.Raycaster();

const pointer =
new THREE.Vector2();


renderer.domElement.addEventListener(

"pointerdown",

event => {

pointer.x =

    (
        event.clientX /
        window.innerWidth
    )
    *
    2
    -
    1;


pointer.y =

    -(
        event.clientY /
        window.innerHeight
    )
    *
    2
    +
    1;


raycaster.setFromCamera(

    pointer,

    camera

);


const meshes =
planets.map(

    p =>
    p.mesh

);


const hits =
raycaster.intersectObjects(

    meshes

);


if (
hits.length === 0
) {

info.classList.remove(
    "show"
);

return;

}


const selected =
hits[0].object;


const planet =
planets.find(

p =>
p.mesh ===
selected

);


if (!planet) {
    return;
}


planetName.textContent =
planet.data.name;


planetDescription.textContent =
planet.data.description;


info.classList.add(
    "show"
);


controls.target.copy(
    planet.mesh.position
);

}

);


/* =====================================================
   АНИМАЦИЯ
===================================================== */

const clock =
new THREE.Clock();


function animate() {

requestAnimationFrame(
    animate
);


const delta =
clock.getDelta();


/* Солнце */

sun.rotation.y +=
delta *
0.008;


/* Планеты */

for (
const planet
of planets
) {

/*
   СУПЕР-МЕДЛЕННАЯ
   ОРБИТА
*/

planet.angle +=

    planet.data.speed;


/* Положение */

planet.mesh.position.x =

    Math.cos(
        planet.angle
    )
    *
    planet.data.distance;


planet.mesh.position.z =

    Math.sin(
        planet.angle
    )
    *
    planet.data.distance;


/* Вращение */

planet.mesh.rotation.y +=

    delta *
    planet.data.rotation;

}


/* =====================================================
   ЛУНА
===================================================== */

const moonTime =

performance.now()
*
0.00013;


moon.position.x =

earth.mesh.position.x
+
Math.cos(moonTime)
*
6;


moon.position.y =
0.5;


moon.position.z =

earth.mesh.position.z
+
Math.sin(moonTime)
*
6;


/* =====================================================
   АСТЕРОИДЫ
===================================================== */

asteroidBelt.rotation.y +=

delta *
0.00012;


/* =====================================================
   ЗВЁЗДЫ
===================================================== */

stars.rotation.y +=

delta *
0.000035;


/* =====================================================
   КАМЕРА
===================================================== */

controls.update();


/* =====================================================
   РЕНДЕР
===================================================== */

renderer.render(

    scene,

    camera

);

}


/* =====================================================
   RESIZE
===================================================== */

window.addEventListener(

"resize",

() => {

camera.aspect =

    window.innerWidth /
    window.innerHeight;


camera.updateProjectionMatrix();


renderer.setSize(

    window.innerWidth,

    window.innerHeight

);

}

);


/* =====================================================
   START
===================================================== */

animate();

</script>

</body>
</html>
